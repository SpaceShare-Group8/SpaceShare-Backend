            example:
              token: reset-token-here
              password: NewPassword123!
  /auth/me:
    get:
      summary: Get Me
      tags:
        - Auth
      parameters: []
      responses:
        '200':
          description: Successful response
      security:
        - bearerAuth: []
  /workspaces:
    post:
      summary: Create Workspace (Host)
      tags:
        - Workspaces
      parameters: []
      responses:
        '200':
          description: Successful response
      requestBody:
        content:
          application/json:
            example:
              title: Quiet Desk Lagos
              workspace_type: desk
              capacity: 2
              city: Lagos
              address: 12 Adeola Odeku St
              latitude: 6.4281
              longitude: 3.4219
      security:
        - bearerAuth: []
    get:
      summary: List Workspaces (filters)
      tags:
        - Workspaces
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
        - name: minCapacity
          in: query
          required: false
          schema:
            type: string
        - name: minPrice
          in: query
          required: false
          schema:
            type: string
        - name: maxPrice
          in: query
          required: false
          schema:
            type: string
        - name: amenities
          in: query
          required: false
          schema:
            type: string
        - name: minReliabilityScore
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful response
