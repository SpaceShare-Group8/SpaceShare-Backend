openapi: 3.0.0
info:
  title: SpaceShare API — Full Live Coverage
  description: >-
    Every endpoint actually mounted in app.js as of the final patch, verified by
    booting the real server against a live database. Endpoints that exist in
    code but aren't reachable (e.g. the old unmounted payment module) are
    excluded.
  version: 1.0.0
servers:
  - url: 'http://localhost:4000'
    description: Root Server
  - url: 'http://localhost:4000/api'
    description: API Base Server
paths:
  /health:
    get:
      summary: Health Check
      tags:
        - Health
      parameters: []
      responses:
        '200':
          description: Successful response
  /auth/register:
    post:
      summary: Register
      tags:
        - Auth
      parameters: []
      responses:
        '200':
          description: Successful response
      requestBody:
        content:
          application/json:
            example:
              email: user@example.com
              password: Password123!
              full_name: Test User
              phone: '+2348011112222'
              role: seeker
  /auth/login:
    post:
      summary: Login
      tags:
        - Auth
      parameters: []
      responses:
        '200':
          description: Successful response
      requestBody:
        content:
          application/json:
            example:
              email: user@example.com
              password: Password123!
  /auth/refresh:
    post:
      summary: Refresh Token
      tags:
        - Auth
      parameters: []
      responses:
        '200':
          description: Successful response
      requestBody:
        content:
          application/json:
            example:
              refreshToken: '{{refreshToken}}'
  /auth/forgot-password:
    post:
      summary: Forgot Password
      tags:
        - Auth
      parameters: []
      responses:
        '200':
          description: Successful response
      requestBody:
        content:
          application/json:
            example:
              email: user@example.com
  /auth/reset-password:
